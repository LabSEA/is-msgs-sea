name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/main.yml

  publish:
    needs: validation
    name: Publish validated artifacts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(cat .version)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag v$tag_version does not match package version $package_version"
            exit 1
          }

      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: is-msgs-sea-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
