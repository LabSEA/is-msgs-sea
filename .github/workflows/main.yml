name: Main

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        protobuf: ["protobuf>=5.29,<6", "protobuf>=6,<7", "protobuf>=7,<8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]' '${{ matrix.protobuf }}'
      - run: pytest
      - run: python -c "import is_msgs.common_pb2, is_msgs.image_pb2, is_msgs.robot_pb2, is_msgs.ros_pb2"

  codegen-and-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch the is-msgs 1.1.18 compatibility baseline
        run: >-
          git fetch https://github.com/labvisio/is-msgs.git
          refs/tags/v1.1.18:refs/tags/v1.1.18
      - run: python -m pip install '.[dev,codegen]'
      - run: python scripts/check_descriptor_compatibility.py
      - run: python scripts/generate_python.py
      - run: git diff --exit-code
      - run: ruff check python scripts
      - run: basedpyright python/tests/unit/test_is_msgs.py

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "from is_msgs.ros_pb2 import TFMessage; assert TFMessage.DESCRIPTOR.full_name == 'is.ros.TFMessage'"
      - uses: actions/upload-artifact@v4
        with:
          name: is-msgs-sea-1.2.0
          path: dist/*
