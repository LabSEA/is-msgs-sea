syntax = "proto3";

package is.common;

option java_package = "com.is.common";
option java_multiple_files = true;

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

// Common timestamp and frame identifier used by stamped sensor messages.
message Header {
  google.protobuf.Timestamp stamp = 1;
  string frame_id = 2;
}

// Three-dimensional vector represented with ROS-compatible double precision.
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Quaternion rotation represented as (x, y, z, w).
message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Twist {
  Vector3 linear = 1;
  Vector3 angular = 2;
}

message Transform {
  Vector3 translation = 1;
  Quaternion rotation = 2;
}

message TransformStamped {
  Header header = 1;
  string child_frame_id = 2;
  Transform transform = 3;
}

message SamplingSettings {
  // Sampling frequency in hertz.
  google.protobuf.FloatValue frequency = 1;
  /* Delay to be applied in the in the sampling proccess, normally used to
     synchronize different sources. */
  google.protobuf.FloatValue delay = 2;
}

message SyncRequest {
  repeated string entities = 1;
  SamplingSettings sampling = 2;
}

// Used to select the desired fields of a message on a "Get" RPC.
message FieldSelector {
  // List of fields that should be filled.
  repeated uint32 fields = 1;
}

message Shape {
  message Dimension {
    // Number of elements in this dimension.
    int32 size = 1;
    /* Dimension identifier. This can be used to indicate the order that the dimensions are
       placed in a tensor. For instance, in a tensor with two dimensions (matrix) the name can be
       something like "row" or "collumn" indicating if the memory layout is row or collumn major. */
    string name = 2;
  }
  repeated Dimension dims = 1;
}

enum DataType {
  UNKNOWN_TYPE = 0;
  FLOAT_TYPE = 1;
  DOUBLE_TYPE = 2;
  INT32_TYPE = 3;
  INT64_TYPE = 4;
}

message Tensor {
  /* Shape of the tensor. Define how the tensor is represented in one of the value
     fields (floats, doubles, ints32, ints64). */
  Shape shape = 1;
  // Type of the tensor values.
  DataType type = 2;

  repeated float floats = 3 [packed=true];
  repeated double doubles = 4 [packed=true];
  repeated int32 ints32 = 5 [packed=true];
  repeated int64 ints64 = 6 [packed=true];
}

message Position {
  // Position in the x axis.
  float x = 1;
  // Position in the y axis.
  float y = 2;
  // Position in the z axis.
  float z = 3;
  // Double-precision representation for consumers that require it.
  Vector3 precise = 4;
  // Present when the source is a stamped position/vector message.
  Header header = 5;
}

message Orientation {
  // Rotation around x.
  float yaw = 1;
  // Rotation around y.
  float pitch = 2;
  // Rotation around z.
  float roll = 3;
  // Original quaternion when available; Euler fields remain for compatibility.
  Quaternion quaternion = 4;
  // Present when the source is a stamped orientation message.
  Header header = 5;
}

message Pose {
  Position position = 1;
  Orientation orientation = 2;
  Header header = 3;
}

message Speed {
  float linear = 1;
  float angular = 2;
  // Full 3D velocity; scalar fields retain the legacy x/z projection.
  Twist twist = 3;
  Header header = 4;
}

message PoseWithCovariance {
  Pose pose = 1;
  // Row-major 6x6 covariance matrix.
  repeated double covariance = 2 [packed=true];
}

message SpeedWithCovariance {
  Speed speed = 1;
  // Row-major 6x6 covariance matrix.
  repeated double covariance = 2 [packed=true];
}

message ConsumerInfo {
  // List of consumers.
  repeated string consumers = 2;
}

message ConsumerList {
  // Consumer Information for each topic.
  map<string, ConsumerInfo> info = 1;
}

message Phrase {
  // List of words.
  repeated string content = 1;
  // Confidence of recognized phrase.
  float confidence = 2;
  // Identifies language using Locale Name pattern.
  string language = 3;
}
